<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제주 여행 · 2026.7.29 - 8.1</title>
<style>
  @font-face {
    font-family: 'Wanted Sans';
    font-weight: 400;
    font-style: normal;
    src: url('fonts/WantedSans-Regular.otf') format('opentype');
  }
  @font-face {
    font-family: 'Wanted Sans';
    font-weight: 700 900;
    font-style: normal;
    src: url('fonts/WantedSans-Bold.otf') format('opentype');
  }

  :root {
    --bg: #f5f8fb;
    --bg-sky-top: #bfe4fb;
    --surface: #ffffff;
    --surface-sunken: #eef3f9;
    --text: #17233a;
    --text-secondary: #5c6b81;
    --text-faint: #99a5b8;
    --line: #e2eaf3;
    --accent: #1a56b0;
    --accent-soft: #e5eefb;
    --accent-ink: #0c3f85;
    --naver: #03c75a;
    --naver-soft: #dcf7e6;
    --naver-ink: #04381c;
    --danger: #e0483f;
    /* One sky gradient shared by the fixed backdrop and the header, both
       anchored to the top of the viewport so they line up seamlessly. */
    --sky: linear-gradient(180deg, #bfe4fb 0%, #cdeafd 20%, #dcf0fb 44%, #ebf5fb 68%, rgba(245, 248, 251, 0) 100%);
    --sky-h: 340px;
    --input-fs: 13.5px;
    --shadow: 0 1px 2px rgba(15, 35, 60, 0.05), 0 8px 22px rgba(15, 35, 60, 0.07);
    color-scheme: light;
  }

  /* iOS Safari zooms in whenever a focused field's text is under 16px, so on
     phones every input goes to exactly 16px to keep the page from scaling. */
  @media (max-width: 767px) {
    :root { --input-fs: 16px; }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Wanted Sans', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* One viewport tall, split into fixed header + the horizontal day pager.
     svh keeps the height stable while iOS shows/hides its address bar. */
  .screen {
    max-width: 460px; margin: 0 auto; position: relative;
    height: 100vh; height: 100svh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  /* Fixed to the viewport, so the blue stays behind the content while the page
     scrolls instead of scrolling away and leaving a bare white background. */
  body::before {
    content: ""; position: fixed; top: 0; left: 0; right: 0; height: var(--sky-h);
    background: var(--sky); pointer-events: none; z-index: 0;
  }
  main, #overlayRoot { position: relative; z-index: 1; }

  /* Fixed header carrying its own slice of the sky gradient, plus a spacer of
     the same height in the flow. It never moves or resizes — the day pager
     below it does all the scrolling. */
  header.trip {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 20;
    /* Same gradient as the backdrop, sized to the same 340px and pinned to the
       top, so the header's slice continues into the backdrop with no seam. */
    background: var(--sky);
    background-size: 100% var(--sky-h);
    background-repeat: no-repeat;
    transition: box-shadow 0.22s ease;
  }
  .trip-inner { max-width: 460px; margin: 0 auto; padding: 18px 20px 10px; }

  .eyebrow-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .eyebrow { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; color: var(--accent-ink); letter-spacing: 0.03em; }
  .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .badge-row { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .dday { background: var(--accent-ink); color: #fff; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 8px; letter-spacing: 0.01em; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint); flex: 0 0 auto; }
  .sync-dot.live { background: #1fbf6a; }
  .sync-dot.err { background: var(--danger); }

  h1.title { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -0.01em; color: var(--text); }
  .dates { font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums; margin: 3px 0 0; }

  /* Day pills double as the pager control for the swipe carousel. */
  nav.daynav { display: flex; gap: 6px; padding: 0 14px 10px; max-width: 460px; margin: 0 auto; overflow-x: auto; scrollbar-width: none; }
  nav.daynav::-webkit-scrollbar { display: none; }
  nav.daynav button {
    flex: 1 1 0; min-width: 0; text-align: center; color: var(--accent-ink); background: var(--surface);
    border: 1px solid var(--line); padding: 7px 6px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
    white-space: nowrap; box-shadow: var(--shadow); cursor: pointer; font-family: inherit;
    transition: background 0.18s ease, color 0.18s ease;
  }
  nav.daynav button.active { background: var(--accent-ink); color: #fff; border-color: transparent; }

  /* Horizontal pager: one day per screen, snapping as you swipe. */
  main {
    flex: 1 1 auto; min-height: 0;
    display: flex; flex-direction: row; padding: 0;
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory;
    overscroll-behavior-x: contain;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  main::-webkit-scrollbar { display: none; }

  section.day {
    flex: 0 0 100%; width: 100%;
    scroll-snap-align: start; scroll-snap-stop: always;
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 4px 16px 40px;
    scrollbar-width: none;
  }
  section.day::-webkit-scrollbar { display: none; }
  .day-head { padding: 2px 4px 12px; }
  .day-head .top-row { display: flex; align-items: center; gap: 9px; }
  .day-head .n {
    font-size: 13px; font-weight: 800; color: #fff; background: var(--accent-ink);
    padding: 4px 11px; border-radius: 999px; letter-spacing: 0.01em;
  }
  .day-head .d { font-size: 14.5px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  .day-head .theme { margin: 7px 0 0 2px; font-size: 12.5px; font-weight: 700; color: var(--text-secondary); }
  .day-body { display: flex; flex-direction: column; gap: 8px; }

  .stop-card, .transit-card, .vote-card, .add-form {
    background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 12px 14px; position: relative;
  }
  .transit-card { padding: 7px 14px 7px 12px; margin-left: 30px; width: calc(100% - 30px); background: var(--surface-sunken); box-shadow: none; border: 1px dashed var(--line); }

  .item-main { display: flex; align-items: center; gap: 8px; }

  .time-block { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; min-width: 54px; }
  .time-block .hm { font-size: 23px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -0.02em; }
  .time-block .dash { color: var(--text-faint); font-size: 17px; }

  .badge { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .badge svg { width: 17px; height: 17px; }
  .transit-badge { width: 22px; height: 22px; background: transparent !important; color: var(--text-secondary); }
  .transit-badge svg { width: 13px; height: 13px; }

  .title-block { flex: 1 1 auto; min-width: 0; }
  .name { font-size: 15.5px; font-weight: 700; margin: 0; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta-row { font-size: 12px; color: var(--text-secondary); margin: 2px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .transit-text { font-size: 12.5px; font-weight: 700; color: var(--text-secondary); margin: 0; }
  .vote-label { font-size: 11px; font-weight: 800; color: var(--accent-ink); background: var(--accent-soft); border-radius: 7px; padding: 3px 7px 3px 6px; display: inline-flex; align-items: center; gap: 3px; margin-top: 2px; }
  .vote-label svg { width: 12px; height: 12px; }

  a.maplink-icon, .icon-btn {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center; border-radius: 50%;
    border: none; cursor: pointer; text-decoration: none;
  }
  a.maplink-icon { width: 30px; height: 30px; background: var(--naver-soft); color: var(--naver); transition: filter 0.15s ease; }
  a.maplink-icon svg { width: 14px; height: 14px; }
  a.maplink-icon:hover { filter: brightness(1.05); }
  a.maplink-icon:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a.maplink-icon.small { width: 24px; height: 24px; }
  a.maplink-icon.small svg { width: 12px; height: 12px; }

  .icon-btn { width: 26px; height: 26px; background: transparent; color: var(--text-faint); font-size: 15px; font-family: inherit; }
  .icon-btn svg { width: 13px; height: 13px; }
  .icon-btn:hover { background: var(--surface); color: var(--text-secondary); }
  .icon-btn.danger:hover { color: var(--danger); }

  .stop-card, .transit-card, .vote-card, .poll-item { transition: transform 0.15s ease, box-shadow 0.15s ease; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  .stop-card.pressing, .transit-card.pressing, .vote-card.pressing, .poll-item.pressing { transform: scale(0.96); box-shadow: none; }

  .empty-card { border: 1.5px dashed var(--line); border-radius: 20px; padding: 26px 16px; text-align: center; }
  .empty-card p { margin: 0 0 4px; font-size: 14px; color: var(--text-faint); font-weight: 600; }
  .empty-card span { font-size: 12.5px; color: var(--text-faint); }

  .insert-row-plain { display: flex; justify-content: center; padding: 2px 0; }
  .transit-connector { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 2px 0; }
  .distance-chip {
    display: inline-flex; align-items: center; gap: 5px; text-decoration: none;
    background: var(--surface); border: 1px solid var(--line); color: var(--text-secondary);
    font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 999px; box-shadow: var(--shadow);
  }
  .distance-chip svg { width: 13px; height: 13px; color: var(--accent-ink); }
  .distance-chip:hover { background: var(--surface-sunken); }

  .insert-plus {
    flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; border: 1.5px dashed var(--line);
    background: var(--surface); color: var(--text-faint); font-size: 15px; font-weight: 800; line-height: 1;
    display: flex; align-items: center; justify-content: center; cursor: pointer; font-family: inherit;
  }
  .insert-plus:hover { background: var(--surface-sunken); color: var(--accent-ink); border-color: var(--accent); }
  .add-plus-row { display: flex; justify-content: center; padding: 4px 0; }
  .insert-plus.large { width: 38px; height: 38px; font-size: 20px; }

  .reveal { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows 0.32s ease, opacity 0.24s ease; }
  .reveal.open { grid-template-rows: 1fr; opacity: 1; }
  .reveal > .add-form { overflow: hidden; min-height: 0; }
  @media (prefers-reduced-motion: reduce) { .reveal { transition: none; } }

  .add-form { background: var(--surface-sunken); }
  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .form-divider { height: 1px; background: var(--line); margin: 4px 0 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; border: 1.5px solid var(--line); background: var(--surface);
    color: var(--text-secondary); font-size: 12.5px; font-weight: 700; padding: 6px 10px; border-radius: 999px;
    cursor: pointer; font-family: inherit;
  }
  .chip svg { width: 13px; height: 13px; }
  .chip.selected { border-color: transparent; color: #fff; }
  .form-grid { display: flex; gap: 8px; margin-bottom: 8px; }
  .form-grid input {
    flex: 1; min-width: 0; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px;
    padding: 9px 10px; font-size: var(--input-fs); color: var(--text); font-family: inherit;
  }
  .form-grid input:focus, .add-form > input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .add-form > input {
    width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px;
    padding: 9px 10px; font-size: var(--input-fs); color: var(--text); font-family: inherit; margin-bottom: 10px;
  }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .form-actions button, .poll-edit-actions button { border: none; font-family: inherit; font-weight: 700; font-size: 13px; padding: 8px 14px; border-radius: 10px; cursor: pointer; }
  .btn-cancel { background: transparent; color: var(--text-secondary); }
  .btn-cancel:hover { background: var(--line); }
  .btn-text-danger { background: transparent; color: var(--danger); margin-right: auto; }
  .btn-text-danger:hover { background: #fbe9e7; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { filter: brightness(1.08); }

  .vote-candidates { list-style: none; margin: 10px 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .poll-item { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 10px; border-radius: 14px; background: var(--surface-sunken); }
  .poll-name { flex: 1 1 auto; min-width: 0; font-size: 14px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .poll-vote-btn {
    flex: 0 0 auto; display: flex; align-items: center; gap: 5px; border: none; background: var(--surface);
    color: var(--text-faint); font-weight: 800; font-size: 12.5px; padding: 6px 11px; border-radius: 999px;
    cursor: pointer; font-family: inherit; font-variant-numeric: tabular-nums;
  }
  .poll-vote-btn svg { width: 14px; height: 14px; }
  .poll-item.voted .poll-vote-btn { color: var(--accent-ink); background: var(--accent-soft); }
  .poll-item-edit { flex-direction: column; align-items: stretch; gap: 8px; padding: 10px; }
  .poll-edit-fields { display: flex; flex-direction: column; gap: 6px; }
  .poll-edit-fields input {
    border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px;
    padding: 8px 10px; font-size: var(--input-fs); font-family: inherit; color: var(--text);
  }
  .poll-edit-fields input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .poll-edit-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .poll-add-row { display: flex; gap: 6px; }
  .poll-add-row input {
    flex: 1; min-width: 0; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px;
    padding: 8px 10px; font-size: var(--input-fs); font-family: inherit; color: var(--text);
  }
  .poll-add-row input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .poll-add-row button {
    flex: 0 0 auto; border: none; background: var(--accent); color: #fff; font-weight: 700; font-size: 13px;
    padding: 8px 14px; border-radius: 10px; cursor: pointer; font-family: inherit;
  }
  .poll-add-row button:hover { filter: brightness(1.1); }

  /* "추가" next to the candidate field inside the edit form — same blue as the
     one on the vote card, so both add-buttons read as the same control. */
  .btn-inline-add {
    flex: 0 0 auto; border: none; background: var(--accent); color: #fff; font-weight: 700; font-size: 13px;
    padding: 9px 16px; border-radius: 10px; cursor: pointer; font-family: inherit;
  }
  .btn-inline-add:hover { filter: brightness(1.1); }

  /* The hint lives at the bottom of each day column now that the page itself
     doesn't scroll vertically. */
  .day-hint { margin: 18px 4px 0; text-align: center; font-size: 11.5px; color: var(--text-faint); line-height: 1.6; }

  .overlay-backdrop { position: fixed; inset: 0; background: rgba(15, 25, 45, 0.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 24px; }
  .overlay-card { background: var(--surface); border-radius: 20px; padding: 22px 20px; max-width: 300px; width: 100%; box-shadow: var(--shadow); }
  .overlay-title { font-size: 16px; font-weight: 800; margin: 0 0 6px; }
  .overlay-desc { font-size: 13px; color: var(--text-secondary); margin: 0 0 18px; }
  .overlay-actions { display: flex; gap: 8px; justify-content: flex-end; }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(12px);
    max-width: 340px; width: calc(100% - 40px); z-index: 60;
    background: #2b2f3a; color: #fff; font-size: 13px; font-weight: 600; line-height: 1.5;
    padding: 12px 16px; border-radius: 14px; box-shadow: 0 8px 26px rgba(0, 0, 0, 0.28);
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .config-warning { margin: 40px 20px; padding: 18px; background: #fff4ea; border: 1px solid #f3d9b8; border-radius: 16px; font-size: 13px; line-height: 1.7; color: #6b4a1c; }
  .config-warning code { background: #fff; padding: 1px 5px; border-radius: 5px; }

  @media (prefers-reduced-motion: reduce) { a.maplink-icon { transition: none; } }
</style>
</head>
<body>

<div class="screen">
  <header class="trip">
    <div class="trip-inner">
      <div class="eyebrow-row">
        <div class="eyebrow"><span class="dot"></span>JEJU TRIP</div>
      </div>
      <div class="title-row">
        <h1 class="title">제주 여행</h1>
        <div class="badge-row">
          <span class="sync-dot" id="syncDot" title="동기화 상태"></span>
          <span class="dday" id="ddayBadge"></span>
        </div>
      </div>
      <p class="dates">2026.07.29 (수) — 08.01 (토) · 3박 4일</p>
    </div>
    <nav class="daynav" id="daynav"></nav>
  </header>
  <div id="headerSpacer" aria-hidden="true"></div>

  <main id="days"></main>
  <div id="overlayRoot"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
